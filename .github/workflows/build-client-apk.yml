name: Build Client Portal Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Client App Dependencies & Sync
      run: |
        cd client-app
        npm install
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Client APK
      run: |
        cd client-app/android
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace

    - name: Upload Client APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: RawasiAden-Client-App.apk
        path: client-app/android/app/build/outputs/apk/debug/app-debug.apk
