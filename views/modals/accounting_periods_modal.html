<!-- ================== نافذة إدارة الفترات المحاسبية وإقفال الحسابات ================== -->
<div id="accountingPeriodsModal" class="modal-overlay">
  <div class="modal-box" style="max-width: 900px; width: 95%;">
    <div class="modal-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 1.4rem;">🔒</span>
        <h3 style="color: var(--gold-light); margin: 0;">إدارة الفترات المحاسبية وإقفال الحسابات الرسمية</h3>
      </div>
      <button type="button" class="btn-close" data-action="close-modal" data-modal="accountingPeriodsModal" onclick="App.closeModal('accountingPeriodsModal')">&times;</button>
    </div>
    <div class="modal-body" style="padding: 20px;">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
        <p style="color: var(--text-secondary); font-size: 0.88rem; margin: 0;">
          استعراض حالة الفترات المالية والربع سنوية، وإقفال الفترات المنتهية بكلمة مرور الإدارة لمنع التعديل على التواريخ السابقة.
        </p>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn-secondary btn-sm" onclick="Accounting.loadPeriods()">🔄 تحديث</button>
        </div>
      </div>

      <div class="table-responsive">
        <table class="custom-table">
          <thead>
            <tr>
              <th>اسم الفترة</th>
              <th>السنة المالية</th>
              <th>من تاريخ</th>
              <th>إلى تاريخ</th>
              <th>الحالة</th>
              <th>أقفلت بواسطة</th>
              <th>إجراء الإقفال / الفتح</th>
            </tr>
          </thead>
          <tbody id="accountingPeriodsTableBody">
            <tr><td colspan="7" style="text-align: center; color: var(--text-secondary);">جاري تحميل الفترات...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" onclick="App.closeModal('accountingPeriodsModal')">إغلاق</button>
    </div>
  </div>
</div>
