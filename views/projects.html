<section id="projectsView" class="app-view-section" style="display: none;">
        <div class="page-header-row">
          <div>
            <h2 class="page-title" id="projectsPageHeading">إدارة وتفاصيل كافة المشاريع</h2>
            <p style="color: var(--text-secondary); font-size: 0.85rem; margin-top: 4px;">متابعة المشاريع الجارية ومشاريع تحت الدراسة وتسعير العطاءات والتكاليف الفعلية</p>
          </div>
          <div class="page-actions">
            <button class="btn btn-primary" onclick="Projects.openNewModal()">مشروع جديد +</button>
            <button class="btn btn-secondary" onclick="Projects.loadProjects()">تحديث</button>
          </div>
        </div>

        <!-- أشرطة تصفية المشاريع -->
        <div class="report-tabs-bar" style="margin-bottom: 12px;">
          <button class="report-tab-btn active" id="tabBtn_proj_all" onclick="Projects.filterStatus('all', this)">كافة المشاريع</button>
          <button class="report-tab-btn" id="tabBtn_proj_active" onclick="Projects.filterStatus('active', this)">المشاريع الجارية والمنفذة</button>
          <button class="report-tab-btn" id="tabBtn_proj_under_study" onclick="Projects.filterStatus('under_study', this)">مشاريع تحت الدراسة والعطاءات</button>
          <button class="report-tab-btn" id="tabBtn_proj_completed" onclick="Projects.filterStatus('completed', this)">المشاريع المكتملة</button>
        </div>

        <!-- شريط البحث والفلترة المتقدمة للمشاريع -->
        <div class="projects-filter-bar">
          <div class="projects-filter-grid">
            <!-- 1. حقل البحث بالاسم والكود والملاحظات -->
            <div class="filter-field-group">
              <label for="projSearchInput">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                <span>بحث سريع</span>
              </label>
              <div class="filter-search-wrap">
                <input type="text" id="projSearchInput" class="form-control filter-search-input" placeholder="اسم المشروع، الكود، الملاحظات..." oninput="Projects.applyFilters()" autocomplete="off">
                <button type="button" id="projSearchClearBtn" class="filter-clear-icon-btn" onclick="Projects.clearSearchInput()" title="تفريغ البحث" style="display: none;">✕</button>
              </div>
            </div>

            <!-- 2. فلتر حالة المشروع -->
            <div class="filter-field-group">
              <label for="projFilterStatus">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                <span>حالة المشروع</span>
              </label>
              <select id="projFilterStatus" class="form-control" onchange="Projects.onFilterStatusChange(this.value)">
                <option value="all">كافة الحالات (الكل)</option>
                <option value="active">جاري التنفيذ</option>
                <option value="under_study">تحت الدراسة والتسعير</option>
                <option value="completed">مكتمل ومستلم</option>
                <option value="paused">متوقف مؤقتاً</option>
              </select>
            </div>

            <!-- 3. فلتر العميل / المالك -->
            <div class="filter-field-group">
              <label for="projFilterClient">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7V3H2v18h20V7H12zM6 19H4v-2h2v2zm0-4H4v-2h2v2zm0-4H4V9h2v2zm0-4H4V5h2v2zm4 12H8v-2h2v2zm0-4H8v-2h2v2zm0-4H8V9h2v2zm0-4H8V5h2v2zm10 12h-8v-2h2v-2h-2v-2h2v-2h-2V9h8v10zm-2-8h-2v2h2v-2zm0 4h-2v2h2v-2z"/></svg>
                <span>العميل / المالك</span>
              </label>
              <select id="projFilterClient" class="form-control" onchange="Projects.applyFilters()">
                <option value="all">جميع العملاء</option>
              </select>
            </div>

            <!-- 4. النطاق الزمني: من تاريخ -->
            <div class="filter-field-group">
              <label for="projFilterDateFrom">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                <span>من تاريخ</span>
              </label>
              <input type="date" id="projFilterDateFrom" class="form-control" onchange="Projects.applyFilters()">
            </div>

            <!-- 5. النطاق الزمني: إلى تاريخ -->
            <div class="filter-field-group">
              <label for="projFilterDateTo">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11zM7 10h5v5H7z"/></svg>
                <span>إلى تاريخ</span>
              </label>
              <input type="date" id="projFilterDateTo" class="form-control" onchange="Projects.applyFilters()">
            </div>

            <!-- 6. زر إعادة التعيين -->
            <div class="filter-field-group">
              <button type="button" class="btn btn-secondary" onclick="Projects.resetFilters()" title="إعادة تعيين كافة الفلاتر والبحث" style="min-height: 38px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                <span>إلغاء الفلاتر</span>
              </button>
            </div>
          </div>

          <!-- السطر الإحصائي والتحديد السريع -->
          <div class="filter-summary-row">
            <div id="projFilterCounter" class="filter-counter-badge">
              <span>عرض <strong id="projFilteredCount">0</strong> من إجمالي <strong id="projTotalCount">0</strong> مشروع</span>
            </div>
            <div class="filter-preset-chips">
              <span style="font-size: 0.75rem; color: var(--text-secondary);">فترات سريعة:</span>
              <button type="button" class="filter-preset-btn" onclick="Projects.setDatePreset('this_month')">هذا الشهر</button>
              <button type="button" class="filter-preset-btn" onclick="Projects.setDatePreset('last_3_months')">آخر 3 أشهر</button>
              <button type="button" class="filter-preset-btn" onclick="Projects.setDatePreset('this_year')">هذا العام</button>
              <button type="button" class="filter-preset-btn" onclick="Projects.setDatePreset('all')">كافة الفترات</button>
            </div>
          </div>
        </div>

        <div class="panel-card">
          <div class="table-responsive">
            <table class="custom-table">
              <thead>
                <tr>
                  <th>اسم المشروع وكوده</th>
                  <th>العميل</th>
                  <th>الحالة</th>
                  <th>قيمة العقد</th>
                  <th>القيمة التقديرية</th>
                  <th>التكلفة الفعلية</th>
                  <th>نسبة الإنجاز</th>
                  <th>الربح المتوقع</th>
                  <th>الربح الفعلي</th>
                  <th style="text-align: center;">الإجراء</th>
                </tr>
              </thead>
              <tbody id="fullProjectsTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
